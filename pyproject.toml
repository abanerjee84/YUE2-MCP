[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yue-music-local"
version = "0.1.0"
description = "Local YuE2 GGUF music generation with MCP, HTTP and CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "starlette==0.46.2", "uvicorn==0.34.3", "mcp==1.30.0",
  "httpx==0.28.1", "filelock==4.2.10", "huggingface-hub==1.33.0",
  "tomlkit==0.15.2", "truststore==0.10.5", "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.4", "numpy==2.5.4"]

[project.scripts]
yue-music = "yue_music.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yue_music"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
